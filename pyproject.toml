[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "random-graph-phase-transitions"
version = "0.2.0"
description = "Random graph critical scaling and systemic payment contagion"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "matplotlib>=3.8", "scipy>=1.12"]

[project.scripts]
run-experiment = "er_graphs.experiment:run"
network-risk-research = "er_graphs.research:main"

[tool.setuptools.packages.find]
where = ["src"]
